version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bi_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bi_analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bi_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bi_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bi_server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/bi_analytics
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secure-jwt-production-secret-key-2026!
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_SECRET: super-secure-refresh-token-secret-2026!
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bi_client
    restart: always
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  pgdata:
  redisdata:
